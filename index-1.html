<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#85847e;--line:#e3e2dd;--accent:#2a78d6;--warn:#b45309;--ok:#0f7a4f;--bad:#c0392b;
--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#9a9993;--c9:#d4d3cc}

--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#8a8982;--c9:#46453f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e86;--line:#2e2e2b;--accent:#3987e5;--warn:#f0a04b;--ok:#3ec28f;--bad:#e66767;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#8a8982;--c9:#46453f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.top h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:140px}
select,input,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.lnk{border:0;background:none;color:var(--accent);padding:2px 6px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 12px;color:var(--ink2);white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px 0 60px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:650;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ch h3{margin:0;font-size:15px}.ch .sub{color:var(--muted);font-size:12.5px;flex:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.plot svg{display:block;width:100%}
.grid-l{stroke:var(--line);stroke-width:1}.ax{fill:var(--muted);font-size:11px}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:var(--ink);fill-opacity:.05}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--ink2)}.fld input{width:100%;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13.5px}
.row label{color:var(--ink2);display:flex;align-items:center;gap:6px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.hb .nm{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .nm:hover{color:var(--accent)}
.hb .tr{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.hb .bar{height:100%;background:var(--accent);border-radius:7px}

.hb .vl small{color:var(--muted)}
.hb .on{color:var(--accent);font-weight:600}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink2)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.note{font-size:13px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink2)}

#tip{position:fixed;display:none;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:260px}
#tip b{display:block;margin-bottom:3px}#tip div{display:flex;justify-content:space-between;gap:14px}
#tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13.5px;display:none;z-index:60;max-width:90vw}
.sug{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.sug .t{flex:1;min-width:180px}
.sm{width:110px}.xs{width:80px}
@media (max-width:600px){.hb{grid-template-columns:100px 1fr auto}.kpi .v{font-size:19px}}

<body>
<header><div class="wrap">
 <div class="top"><h1>💳 Controle de Cartão</h1>
  <select id="fWho" aria-label="Portador"></select>
  <select id="fSrc" aria-label="Origem dos lançamentos" hidden><option value="todos">Cartão + conta</option><option value="cartao">Só cartão</option><option value="conta">Só conta</option></select>
  <select id="fGrp" aria-label="Agrupar por"><option value="fatura">Mês da fatura (vencimento)</option><option value="compra">Mês da compra</option></select>

 <nav id="nav"></nav>

<script>
const SEED={tx:[],meta:{}};
</script>
<script>
"use strict";
/* ============ utilitários ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt0=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const short=v=>{const a=Math.abs(v),s=v<0?'-':'';return s+(a>=1e6?'R$ '+(a/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?'R$ '+(a/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':'R$ '+Math.round(a))};
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const mkey=s=>norm(s).replace(/[^a-z ]+/g,' ').split(/\s+/).filter(Boolean).slice(0,2).join(' ');
const ckey=s=>norm(s).replace(/[^a-z ]+/g,' ').split(/\s+/).filter(Boolean).slice(0,3).join(' ');
const isConta=t=>t.src==='conta';
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ymLabel=ym=>MES[+ym.slice(5)-1]+'/'+ym.slice(2,4);
const addM=(ym,k)=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const lastDayPrev=ym=>{const p=addM(ym,-1);const d=new Date(Date.UTC(+p.slice(0,4),+p.slice(5),0)).getUTCDate();return p+'-'+String(d).padStart(2,'0')};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const dmy=d=>d.slice(8)+'/'+d.slice(5,7);
const dmyy=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(2,4);
function monday(d){const t=new Date(d+'T12:00:00Z');const k=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-k);return t.toISOString().slice(0,10)}
function addDays(d,n){const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3800)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ============ categorias ============ */
const RULES=[
['Plano de saúde',/\bamil\b|bradesco saude|sulamerica|hapvida|notre dame|porto saude/],
['Moradia e aluguel',/locacao|imobiliaria|imoveis|condominio|aluguel|jba adm/],
['Contas de consumo',/copel|sanepar|eletropaulo|\benel\b|comgas|compagas|sabesp|cemig|energia eletrica/],
['Seguros',/porto ?seg|seguro|seguradora/],
['Lazer e entretenimento',/kingsh|ingresso|museu|parque da|kartodromo|cinema|teatro|vale da musica|steam|playstation|xbox|nintendo|\bgames?\b|gamelandi|sympla|eventim|bowling/],
['Assinaturas',/google (one|youtube|powerdirector|avg)|youtube|netflix|spotify|linkedin|anthropic|claude|kindle|prime video|disney|hbo|icloud|microsoft|adobe|canva|chatgpt|openai|jusbrasil|dropbox|globoplay|deezer|paramount|duolingo/],
['Taxas e serviços financeiros',/\biof\b|anuidade|tarifa|iptu|ipva|detran|multa|juros|cartorio|serasa|conselho regional/],
['Serviços profissionais',/contabilizei|cpa gestao|company ?hero|facebk|advoca|despachante/],
['Educação',/treinamento|curso|uniso|unid\.? ?de ed|escola|faculdade|udemy|alura|livraria|\blivro/],
['Telefonia e internet',/\bclaro\b|net pgt|\bvivo\b|\btim\b|telefon|starlink/],
['Academia e esporte',/muv fit|totalpass|academia|gympass|smartfit|crossfit|pilates|decathlon/],
['Saúde e farmácia',/farmac|drogar|drogasil|\braia|rdsaude|panvel|nissei|pharmac|unipreco|odonto|clinica|laborat|hospital|\bdent|lentes|otica|optica|fisio|psico|unimed|dermat|exame|saude/],
['Estacionamento e Pedágio',/tagitau|sem parar|conectc|veloe|pedagio|estacion|\bestac\b|parking|\bpark\b|brpark|bcpark|panpark|valet|\bzul \d|zona azul|\bgp6\b|cetro p/],
['Carro e combustível',/posto|combustiv|petropen|petrobras|\bshell\b|ipiranga|autozone|centro automotivo|rodoposto|unidas|localiza|movida|autoposto|minuto pa/],
['Viagens e hospedagem',/\bibis|airbnb|mercure|hotel|pousada|hostel|booking|decolar|iberia|gol lin|latam|azul linhas|smiles|clickbus|rodoviaria|buser|apartments|maisonvilla|resort|airlines|lineas|passagem|seutitoboaviagem|expedia|hurb|123milhas/],
['Transporte',/uber(?!aba)|\b99 ?pop|cabify|indrive|transp colet|\bmetro\b|onibus|\btaxi\b|cptm/],
['Mercado',/festval|festival|condor|assai|atacad|carrefour|minipreco|\bextra\b|\bsams\b|komprao|acougue|mestre da carne|sacolao|hortifruti|supermerc|fresh market|frimais|mercadinho|angeloni|muffato|bistek|comper/],
['Beleza e cuidados',/salao|barbe|depil|esteti|cosmetic|perfum|boticario|natura\b|sephora|manicure|\bspa\b/],
['Restaurantes e cafés',/restaur|lanche|grill|churrasc|burger|burguer|padaria|panificadora|\bpao\b|pizza|cafe|coffee|dripper|sushi|esfiha|sfiha|cantin|bistro|\bbar\b|boteco|gastro|ifd\*|sorvet|gelat|chocolat|bakery|brauerei|biergarten|\bdiner\b|steak|mcdonald|rodosnack|casa china|palacio china|pede thai|buffet|nugali|doceria|empada|salgad|churros|trattoria|osteria|pastel|recanto gaucho|madalosso|grelhad/],
['Casa e construção',/leroy|havan|ferragem|casa legal|camicado|kalunga|embalagens|chaveiro|limpemais|dedetiz|lavand|moldura|multicoisas|ponto das caixas|casa dos fri|flor|jardim/],
['Vestuário e calçados',/renner|riachuelo|calcad|adidas|calvin|outlet|\bmoda\b|loungerie|pijama|shoulder|florence|lumae|playsize|jeans|\bzara\b|boutique|lingerie|kidstok|side walk|city confort|\btng\b/],
['Eletrônicos',/samsung|kabum|apple store|iphone|xiaomi|motorola|lg eletron|philips|jbl|fone de ouvido|notebook|celular|eletronic|fast shop|ponto frio|casas bahia|microsoft\*?store/],
['Acessórios e Jóias',/joia|bijou|semijoia|relogio|vivara|pandora|bering|ourives|prataria/],
['Compras online',/mercadolivre|mercado\*|amazon|shopee|aliexpress|magalu|mag\*|americanas|shein|temu|netshoes|dafiti|miniso/],
['Pets',/\bpet\b|petz|cobasi|veterin|racao|miau/]
];
const SEM='Sem categoria',PESS='Transferências a pessoas';
const EXC=['Movimentação interna','Pagamento de fatura do cartão','Receitas'],EXS=new Set(EXC);
/* regras só do extrato da conta (testadas antes das gerais) */
const ACC_RULES=[
['Pagamento de fatura do cartão',/^pers black|^pers |fatura|itaucard/],
['Movimentação interna',/^tbi\b|leandro|juliana|aplicacao|resgate|cofrinho|\bcdb\b|\blci\b|\blca\b|^cor comp|^cor itaucor|nomad|poup aut|^vencimento/]];
const ALLCATS=[...RULES.map(r=>r[0]),PESS,...EXC,SEM].filter((c,i,a)=>a.indexOf(c)===i).sort((a,b)=>a===SEM?1:b===SEM?-1:a.localeCompare(b,'pt'));

/* ============ estado ============ */
const KEY='gcc_v1';
let S;
const DEF={group:'fatura',who:'Todos',src:'todos',partial:false,period:6,weeks:26,incOld:false,baseN:6,stat:'mean',thr:'',novas:false,tab:'resumo',theme:'auto',sel:null,applyAll:true,flt:{f:'',c:'',q:'',pend:false,parc:false,ex:false}};
function seedState(){
  return {tx:SEED.tx.map(r=>{const [n,m]=r[3]?r[3].split('/').map(Number):[null,null];return {f:r[0],d:r[1],desc:r[2],n,m,v:r[4],tit:r[5],nome:r[6],tipo:r[7],cart:r[8]}}),
    meta:JSON.parse(JSON.stringify(SEED.meta)),acc:(SEED.acc||[]).map(x=>x.slice()),cov:(SEED.cov||[]).map(x=>x.slice()),_accSeeded:1,rules:{},ovr:{},fixed:[],dismissed:[],cfg:{...DEF,flt:{...DEF.flt}}};
}
let saveFail=false;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.tx)||!(S.tx.length||(S.acc&&S.acc.length)))S=seedState();
  S.acc=S.acc||[];S.cov=S.cov||[];
  if(!S.acc.length&&!S._accSeeded&&SEED.acc&&SEED.acc.length){S.acc=SEED.acc.map(x=>x.slice());S.cov=SEED.cov.map(x=>x.slice());S._accSeeded=1}
  S.cfg={...DEF,...(S.cfg||{}),flt:{...DEF.flt,...((S.cfg||{}).flt||{})}};
  S.drive=S.drive||{};
  try{const u=new URL(location.href),c=u.searchParams.get('cid'),p=u.searchParams.get('pasta'),g=u.searchParams.get('cfg'),x=u.searchParams.get('ext');if(c||p||g||x){if(c)S.drive.clientId=c;if(p)S.drive.folder=p;if(g)S.drive.folderCfg=g;if(x)S.drive.folderExt=x;history.replaceState(null,'',u.pathname+u.hash)}}catch(e){}
  ['rules','ovr','meta'].forEach(k=>S[k]=S[k]||{});
  [S.rules,S.ovr].forEach(o=>Object.keys(o).forEach(k=>{if(o[k]==='Assinaturas digitais')o[k]='Assinaturas';if(o[k]==='Estacionamento')o[k]='Estacionamento e Pedágio'}));(S.fixed||[]).forEach(f=>{if(f.cat==='Assinaturas digitais')f.cat='Assinaturas';if(f.cat==='Estacionamento')f.cat='Estacionamento e Pedágio'});['fixed','dismissed','bills'].forEach(k=>S[k]=S[k]||[]);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFail=false;if(window.GCC_HOSTED&&S.drive&&S.drive.folderCfg&&snapStr(sharedSnap())!==S.cfgHash)cfgSchedule()}catch(e){if(!saveFail)toast('Não foi possível salvar neste navegador — use Dados › Backup.');saveFail=true}}

/* ============ derivação ============ */
const txh=t=>t.d+'|'+t.desc+'|'+t.v+'|'+(t.m?t.n+'/'+t.m:'');
function catOf(t){const h=txh(t);if(S.ovr[h])return S.ovr[h];const k=isConta(t)?ckey(t.desc):mkey(t.desc);if(S.rules[k])return S.rules[k];
  if(isConta(t)){const n=norm(t.desc.replace(/(\D)(\d)/g,'$1 $2'));
    for(const [c,re] of ACC_RULES)if(re.test(n))return c;
    for(const [c,re] of RULES)if(re.test(n))return c;
    if(t.v<0)return 'Receitas';
    if(/^(pix transf|ted)\b/.test(n)&&!/^(ted d |int ted|ted int)/.test(n))return PESS;
    return SEM}
  const n=norm(t.desc);for(const [c,re] of RULES)if(re.test(n))return c;return SEM}
const whoOf=t=>isConta(t)?'Titular':t.tit==='T'||t.tit==='Titular'?'Titular':norm(t.nome).split(' ')[0].replace(/^./,c=>c.toUpperCase())+' (adicional)';
let CAT_SLOT={};
let ALL=[];
const accTx=a=>({src:'conta',f:a[0].slice(0,7),d:a[0],desc:a[1],n:null,m:null,v:-a[2],tit:'T',nome:'',tipo:'Conta corrente',cart:''});
function prep(){
  ALL=S.tx.concat(S.acc.map(accTx));
  const tot={};
  ALL.forEach(t=>{t.cat=catOf(t);t.ex=EXS.has(t.cat);t.key=isConta(t)?ckey(t.desc):mkey(t.desc);t.who=whoOf(t);t.eff=(t.m&&t.n>=2)?lastDayPrev(t.f):t.d;t.mon=S.cfg.group==='compra'?t.eff.slice(0,7):t.f;
    if(!t.ex&&t.cat!==SEM)tot[t.cat]=(tot[t.cat]||0)+Math.max(t.v,0)});
  CAT_SLOT={};Object.entries(tot).sort((a,b)=>b[1]-a[1]).forEach(([c],i)=>CAT_SLOT[c]=Math.min(i,7));
}
const slotOf=c=>CAT_SLOT[c]===undefined?7:CAT_SLOT[c];
const colorOfSlot=i=>`var(--c${i+1})`;
function viewTx(all,anySrc){const w=S.cfg.who,o=anySrc?'todos':S.cfg.src;return ALL.filter(t=>(all||!t.ex)&&(w==='Todos'||t.who===w)&&(o==='todos'||(o==='conta')===isConta(t)))}
/* cobertura dos extratos importados (para saber quais meses estão completos) */
function covRanges(){const a=(S.cov||[]).map(c=>[c[0],c[1]]).sort();const o=[];a.forEach(r=>{const l=o[o.length-1];if(l&&r[0]<=addDays(l[1],1)){if(r[1]>l[1])l[1]=r[1]}else o.push([r[0],r[1]])});return o}

function okFilter(V){const ha=V.some(isConta);if(!ha)return null;const hc=V.some(t=>!isConta(t)),cm=new Set(V.filter(t=>!isConta(t)).map(t=>t.mon));return m=>monthCovered(m)&&(!hc||cm.has(m))}
const months=V=>{let m=[...new Set(V.map(t=>t.mon))].sort();const ok=okFilter(V);if(ok&&!S.cfg.partial)m=m.filter(ok);return m};

function partialNote(V){const h=hiddenMonths(V);return h.length?`<div class="note">Meses ocultos por estarem <b>incompletos</b> (faltam lançamentos do extrato ou da fatura): <b>${h.map(ymLabel).join(', ')}</b>. Eles distorceriam médias e projeções. <label><input type="checkbox" data-k="partial"> mostrar mesmo assim</label></div>`:(S.cfg.partial&&V.some(isConta)?`<div class="note"><label><input type="checkbox" data-k="partial" checked> mostrando meses incompletos</label></div>`:'')}

const tip=$('#tip');
function showTip(html,e){tip.innerHTML=html;tip.style.display='block';const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=innerHeight-r.height-8;tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px'}

function niceTicks(min,max,cnt){if(max<=min)max=min+1;const raw=(max-min)/cnt,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;const a=Math.floor(min/st)*st,b=Math.ceil(max/st)*st,o=[];for(let v=a;v<=b+st/2;v+=st)o.push(+v.toFixed(6));return o}
/* série por categoria (top 7 por total histórico + Outras) */
function catSeries(V,keys,groupFn){
  const idx={};keys.forEach((k,i)=>idx[k]=i);
  const arr=Array.from({length:9},()=>new Array(keys.length).fill(0));
  V.forEach(t=>{const g=groupFn(t);if(g in idx)arr[t.cat===SEM?8:slotOf(t.cat)][idx[g]]+=t.v});
  const names=Object.keys(CAT_SLOT).filter(c=>CAT_SLOT[c]<7).sort((a,b)=>CAT_SLOT[a]-CAT_SLOT[b]);
  const out=arr.slice(0,7).map((vals,i)=>({name:names[i]||'—',color:colorOfSlot(i),vals})).filter(s=>s.name!=='—');
  out.push({name:'Outras categorias',color:colorOfSlot(7),vals:arr[7]});
  out.push({name:'Sem categoria',color:'var(--c9)',vals:arr[8]});
  return out.filter(s=>s.vals.some(v=>Math.abs(v)>0.004));
}
function drawStacked(el,o){
  const W=Math.max(el.clientWidth,300),H=o.height||290,pl=54,pr=8,pt=10,pb=26,n=o.cols.length;
  let max=0,min=0;const tot=[];

  if(o.avg)max=Math.max(max,o.avg);
  const ticks=niceTicks(min,max,5),y0=ticks[0],y1=ticks[ticks.length-1],iw=W-pl-pr,ih=H-pt-pb,bw=iw/n,bar=Math.min(bw*.74,38);
  const Y=v=>pt+ih*(1-(v-y0)/(y1-y0));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.title)}">`;
  ticks.forEach(t=>s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${short(t)}</text>`);
  const step=Math.max(1,Math.ceil(n*(o.lblw||42)/iw));
  o.cols.forEach((c,i)=>{
    const cx=pl+bw*i+bw/2,x=cx-bar/2;let up=0,dn=0;
    o.series.forEach(se=>{const v=se.vals[i]||0;if(!v)return;let a,b;if(v>=0){a=Y(up+v);b=Y(up);up+=v}else{a=Y(dn);b=Y(dn+v);dn+=v}
      const h=Math.max(b-a-2,1);const st=c.proj?`fill:${se.color};fill-opacity:.5;stroke:${se.color};stroke-dasharray:3 2`:`fill:${se.color}`;
      s+=`<rect x="${x}" y="${a+1}" width="${bar}" height="${h}" rx="2" style="${st}"/>`});
    if((n-1-i)%step===0)s+=`<text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${esc(c.label)}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${pl+bw*i}" y="${pt}" width="${bw}" height="${ih}"/>`;
  });
  s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--muted)"/>`;
  if(o.avg)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(o.avg)}" y2="${Y(o.avg)}" style="stroke:var(--ink);stroke-dasharray:5 4;stroke-width:1.2"/><text class="ax" x="${W-pr}" y="${Y(o.avg)-4}" text-anchor="end" style="fill:var(--ink2)">${esc(o.avgLabel||'média')} ${short(o.avg)}</text>`;
  el.innerHTML=s+'</svg>';
  el.querySelectorAll('.hit').forEach(r=>{const i=+r.dataset.i;
    const f=e=>{const rows=o.series.map(se=>[se,se.vals[i]||0]).filter(x=>Math.abs(x[1])>0.004).sort((a,b)=>b[1]-a[1]);
      showTip(`<b>${esc(o.cols[i].tip||o.cols[i].label)}${o.cols[i].proj?' · projeção':''}</b>`+rows.map(([se,v])=>`<div><span><i style="background:${se.color}"></i>${esc(se.name)}</span><span>${fmt(v)}</span></div>`).join('')+`<div style="margin-top:3px;border-top:1px solid var(--line);padding-top:3px"><b>Total</b><b>${fmt(tot[i])}</b></div>`,e)};
    r.addEventListener('mousemove',f);r.addEventListener('mouseleave',hideTip);
    r.addEventListener('click',e=>{f(e);o.onClick&&o.onClick(i)})});
}
function legendHtml(series,extra){return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${extra||''}</div>`}
function tableHtml(o){

   o.cols.map((c,i)=>`<tr><td>${esc(c.tip||c.label)}${c.proj?' <span class="pill">proj.</span>':''}</td>${o.series.map(s=>`<td class="n">${fmt(s.vals[i]||0)}</td>`).join('')}<td class="n"><b>${fmt(tot(i))}</b></td></tr>`).join('')+'</tbody></table>';

function hbars(items,opt={}){

/* ============ cálculos ============ */
function periodMonths(V){const m=months(V);const p=S.cfg.period;return p==='all'?m:m.slice(-p)}
function catTotals(V,ms){const set=new Set(ms),o={};V.forEach(t=>{if(set.has(t.mon))o[t.cat]=(o[t.cat]||0)+t.v});const T=sum(Object.values(o),x=>Math.max(x,0))||1;
  return Object.entries(o).map(([label,value])=>({label,value,pct:value/T*100})).sort((a,b)=>b.value-a.value)}
function suggestions(){
  const V=S.tx;const ms=[...new Set(V.map(t=>t.f))].sort().slice(-6);const g={};
  V.filter(t=>!t.m&&ms.includes(t.f)&&t.v>0).forEach(t=>{const k=t.key;if(!k)return;const o=g[k]=g[k]||{k,names:{},by:{},cnt:0,virt:0,who:{}};o.names[t.desc]=(o.names[t.desc]||0)+1;o.by[t.f]=(o.by[t.f]||0)+t.v;o.cnt++;o.who[t.who]=(o.who[t.who]||0)+1;if(t.tipo==='Virtual recorrente')o.virt++});
  const out=[];
  for(const o of Object.values(g)){const mm=Object.keys(o.by).sort();if(mm.length<4)continue;const vals=mm.map(m=>o.by[m]),av=mean(vals),cv=Math.sqrt(mean(vals.map(x=>(x-av)**2)))/av,per=o.cnt/mm.length,vr=o.virt/o.cnt;
    if(per>3)continue;if(!((vr>=.5&&cv<=.4)||(per<=1.2&&cv<=.15)))continue;
    if(S.fixed.some(f=>f.key===o.k)||S.dismissed.includes(o.k))continue;
    const nm=Object.entries(o.names).sort((a,b)=>b[1]-a[1])[0][0],who=Object.entries(o.who).sort((a,b)=>b[1]-a[1])[0][0];
    out.push({key:o.k,name:nm,meses:mm.length,valor:Math.round(mean(vals.slice(-3))*100)/100,cv,who,cat:catOf({desc:nm,d:'',v:0,m:null})});}
  /* conta corrente: contas recorrentes (aluguel, plano de saúde, telefone, luz, água...) */
  const accV=ALL.filter(t=>isConta(t)&&!t.ex&&t.v>0&&t.cat!==PESS),am=[...new Set(accV.map(t=>t.f))].sort().filter(monthCovered).slice(-6),ga={};
  accV.filter(t=>am.includes(t.f)).forEach(t=>{const o=ga[t.key]=ga[t.key]||{k:t.key,names:{},by:{},cnt:0};o.names[t.desc]=(o.names[t.desc]||0)+1;o.by[t.f]=(o.by[t.f]||0)+t.v;o.cnt++});
  for(const o of Object.values(ga)){const mm=Object.keys(o.by).sort();if(mm.length<4)continue;const vals=mm.map(m=>o.by[m]),av=mean(vals),cv=Math.sqrt(mean(vals.map(x=>(x-av)**2)))/av;
    if(o.cnt/mm.length>2||cv>.4)continue;if(S.fixed.some(f=>f.key===o.k)||S.dismissed.includes(o.k))continue;
    const nm=Object.entries(o.names).sort((a,b)=>b[1]-a[1])[0][0].replace(/[\s\d\/.\-]+$/,'');
    out.push({key:o.k,name:nm,meses:mm.length,valor:Math.round(mean(vals.slice(-3))*100)/100,cv,who:'Titular',cat:catOf({desc:nm,d:'',v:1,m:null,src:'conta'}),src:'conta'})}

}
const fixedOk=f=>f.ativo&&(S.cfg.who==='Todos'||f.who==='Todos'||f.who===S.cfg.who);
function project(V){
  const c=S.cfg,cards=ALL.filter(t=>!isConta(t)),cf=[...new Set(cards.map(t=>t.f))].sort();
  const allF=[...new Set(ALL.filter(t=>!t.ex).map(t=>t.f))].sort();
  const last=cf.length?cf[cf.length-1]:allF[allF.length-1];
  const ha=V.some(isConta),hc=V.some(t=>!isConta(t));
  const okF=f=>!ha||c.partial||(monthCovered(f)&&(!hc||cf.includes(f)));
  const fats=allF.filter(f=>f<=last&&okF(f)),excl=allF.filter(f=>f<=last&&!okF(f));
  const act=S.fixed.filter(f=>f.ativo&&f.key),fk=new Set(act.filter(fixedOk).map(f=>f.key)),allfk=new Set(act.map(f=>f.key));
  const base=fats.slice(-c.baseN),thr=parseFloat(String(c.thr).replace(',','.'));
  const big=t=>isConta(t)&&t.cat===SEM&&t.v>=5000;
  const H={},vb={},np={};fats.forEach(f=>{H[f]={parc:0,fixo:0,vari:0};vb[f]=0;np[f]=0});
  V.forEach(t=>{const L=H[t.f];if(!L)return;if(t.m){L.parc+=t.v;if(t.n===1)np[t.f]+=t.v}else if(fk.has(t.key))L.fixo+=t.v;else{L.vari+=t.v;if(!(thr>0&&t.v>thr)&&!allfk.has(t.key)&&!big(t))vb[t.f]+=t.v}});
  const agg=a=>c.stat==='median'?median(a):mean(a);
  const vari=agg(base.map(f=>vb[f])),novas=c.novas?agg(base.map(f=>np[f])):0;
  const ms=Array.from({length:12},(_,i)=>addM(last,i+1)),parc=ms.map(()=>0),list={};
  V.forEach(t=>{if(!t.m)return;const k=t.desc+'|'+t.d+'|'+t.m;const o=list[k]=list[k]||{desc:t.desc,d:t.d,m:t.m,n:0,f:'',v:0,who:t.who};if(t.f>=o.f){o.f=t.f;o.n=t.n;o.v=t.v}});
  const open=Object.values(list).filter(o=>o.f===last&&o.n<o.m);
  open.forEach(o=>{for(let k=1;k<=o.m-o.n&&k<=12;k++)parc[k-1]+=o.v;o.rest=(o.m-o.n)*o.v;o.fim=addM(last,o.m-o.n)});
  const fixo=ms.map(ym=>sum(S.fixed.filter(f=>fixedOk(f)&&(!f.ate||ym<=f.ate)),f=>f.valor));
  const conta=ms.map(ym=>sum(S.bills.filter(b=>b.ativo&&(!b.de||ym>=b.de)&&(!b.ate||ym<=b.ate)),b=>b.valor));

}

   kpi('Parcelas a vencer',fmt0(comp),`${P.open.length} parcelamentos em andamento`)+
   (S.bills.some(b=>b.ativo)?kpi('Orçamento previsto '+ymLabel(P.ms[0]),fmt0(nextTot+P.conta[0]),`previsto ${fmt0(nextTot)} + contas fixas lançadas à mão ${fmt0(P.conta[0])}`):'')

/* ============ importação ============ */
const MESN={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function toISO(v){
  if(v instanceof Date)return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  if(typeof v==='string'){const m=v.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;const n=v.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);if(n)return n[0]}
  return null}
function toNum(v){if(typeof v==='number')return v;if(typeof v!=='string')return NaN;let s=v.replace(/[R$\s]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}
function parseSheet(rows,fname){
  const cell=(r,i)=>r[i];let title=null,card=null,hdr=-1;
  rows.forEach((r,i)=>{r.forEach((c,j)=>{if(typeof c==='string'){const m=norm(c).match(/^fatura\s+(\w+)\s*-\s*(\w+)\/(\d{4})/);if(m&&!title)title={st:c.split('-')[0].replace(/^Fatura\s+/i,'').trim(),mes:MESN[m[2]],ano:+m[3]};
      if(/final \d{4}/i.test(c)&&!card){card={valor:toNum(r.find((x,k)=>k>j&&typeof x==='number')),fv:toISO(r.find((x,k)=>k>j&&(x instanceof Date||(typeof x==='number'&&x>20000&&x<80000)||(typeof x==='string'&&toISO(x)))))}}}});
    if(hdr<0&&r.some(c=>typeof c==='string'&&norm(c)==='data')&&r.some(c=>typeof c==='string'&&/^lancamento/.test(norm(c))))hdr=i});
  if(hdr<0)throw new Error('cabeçalho "Data / Lançamento" não encontrado');
  const H={};rows[hdr].forEach((c,j)=>{if(typeof c==='string')H[norm(c)]=j});
  const col=(...ns)=>{for(const n of ns)for(const k in H)if(k.startsWith(n))return H[k];return -1};
  const cD=col('data'),cL=col('lancamento'),cP=col('parcel'),cV=col('valor'),cT=col('titular'),cN=col('nome'),cK=col('tipo do'),cC=col('numero');
  let f=title?`${title.ano}-${String(title.mes).padStart(2,'0')}`:null;
  const fv=card&&card.fv;if(!f&&fv)f=fv.slice(0,7);

  const out=[];
  for(let i=hdr+1;i<rows.length;i++){const r=rows[i],d=toISO(r[cD]);if(!d)continue;const desc=String(r[cL]||'').trim();if(!desc||/^pagamento/i.test(norm(desc)))continue;
    const v=toNum(r[cV]);if(isNaN(v))continue;const pm=String(r[cP]||'').match(/(\d+)\s*de\s*(\d+)/i);
    out.push({f,d,desc,n:pm?+pm[1]:null,m:pm?+pm[2]:null,v:Math.round(v*100)/100,tit:/adic/i.test(String(r[cT]||''))?'A':'T',nome:String(r[cN]||''),tipo:String(r[cK]||''),cart:String(r[cC]||'')})}

}
function ingest(name,rows){

function parseExtratoText(text){

    const it=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];it.forEach(i=>{const l=lines[lines.length-1];if(l&&Math.abs(l.y-i.y)<3)l.it.push(i);else lines.push({y:i.y,it:[i]})});

    if(hdr<0&&r.some(c=>typeof c==='string'&&norm(c)==='data')&&r.some(c=>typeof c==='string'&&/^(lancamento|historico|descricao)/.test(norm(c))))hdr=i});

  const H={};rows[hdr].forEach((c,j)=>{if(typeof c==='string')H[norm(c)]=j});const col=(...ns)=>{for(const n of ns)for(const k in H)if(k.startsWith(n))return H[k];return -1};
  const cD=col('data'),cL=col('lancamento','historico','descricao'),cV=col('valor');if(cV<0)throw new Error('coluna Valor não encontrada');

async function gToken(interactive,kind){kind=kind||'ro';

const folderId=s=>{s=String(s||'').trim();const m=s.match(/folders\/([-\w]{10,})/)||s.match(/[?&]id=([-\w]{10,})/);return m?m[1]:(/^[-\w]{10,}$/.test(s)?s:'')};

async function driveSync(interactive){

  const seen=new Set();S.fixed=Object.values(o.fixed).map(x=>JSON.parse(x)).sort((a,b)=>a.id-b.id).filter(f=>{if(!f.key)return true;if(seen.has(f.key))return false;seen.add(f.key);return true})}
/* fusão em 3 vias: base = último estado sincronizado deste aparelho */
function merge3(l,r,b){const out={};new Set([...Object.keys(l),...Object.keys(r),...Object.keys(b)]).forEach(k=>{const v=(l[k]===b[k])?r[k]:l[k];if(v!==undefined)out[k]=v});return out}
const snapStr=o=>JSON.stringify(SHK.map(k=>Object.keys(o[k]).sort().map(x=>[x,o[k][x]])));
async function gSend(method,url,tok,body,ctype){const r=await fetch(url,{method,headers:{Authorization:'Bearer '+tok,'Content-Type':ctype},body});if(!r.ok){let m='';try{m=(await r.text()).slice(0,160)}catch(e){}throw new Error('Drive '+r.status+(r.status===403?' — sem permissão de edição na pasta de configuração':'')+(m&&r.status!==403?' '+m:''))}return r.json()}
let cfgBusy=false;
async function cfgSync(interactive){
  const id=folderId(S.drive.folderCfg);if(!id||!gClient()||cfgBusy)return false;cfgBusy=true;
  try{const tok=await gToken(interactive,'rw');
    const q=encodeURIComponent(`'${id}' in parents and name='${CFG_NAME}' and trashed=false`);
    const L0=await(await gGet(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)&supportsAllDrives=true&includeItemsFromAllDrives=true`,tok)).json();
    let fid=L0.files&&L0.files[0]&&L0.files[0].id,remote={};
    if(fid){try{remote=JSON.parse(await(await gGet(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media&supportsAllDrives=true`,tok)).text()).data||{}}catch(e){remote={}}}
    const Lc=sharedSnap(),R=snapFromRemote(remote),B=S.cfgBase||emptySnap(),M=emptySnap();
    SHK.forEach(k=>M[k]=merge3(Lc[k],R[k],B[k]||{}));
    const changedLocal=snapStr(M)!==snapStr(Lc);
    applySnap(M);
    const M2=sharedSnap();S.cfgBase=M2;
    if(!fid||snapStr(M2)!==snapStr(R)){
      const content=JSON.stringify({v:1,updated:new Date().toISOString(),data:snapToRemote(M2)});
      if(fid)await gSend('PATCH',`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media&supportsAllDrives=true`,tok,content,'application/json');
      else{const bd='gccb'+Date.now();await gSend('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true',tok,`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:CFG_NAME,parents:[id],mimeType:'application/json'})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${bd}--`,'multipart/related; boundary='+bd)}}
    S.cfgHash=snapStr(M2);S.drive.cfgLast=new Date().toISOString();S.drive.cfgErr='';S.drive.cfgOk=true;save();
    if(changedLocal)render();return true}
  catch(e){S.drive.cfgErr=(!interactive&&!/ 40[34]/.test(e.message)&&!S.drive.cfgOk)?'autorização pendente — toque em “Autorizar e sincronizar classificações”':e.message;save();if(interactive)toast('Classificações compartilhadas: '+e.message);return false}
  finally{cfgBusy=false}
}
let cfgTimer=null;
function cfgSchedule(){if(!window.GCC_HOSTED||!folderId(S.drive.folderCfg)||!gClient())return;clearTimeout(cfgTimer);cfgTimer=setTimeout(()=>cfgSync(false),4000)}
let syncing=false;
async function runSync(interactive){
  if(syncing)return;syncing=true;const set=m=>{const e=document.getElementById('gdMsg');if(e)e.textContent=m};
  set('Sincronizando…');
  try{const r=await driveSync(interactive);finishImport(r.novos?r.msgs:[]);
    if(folderId(S.drive.folderCfg)){await cfgSync(false)}
    toast(r.novos?r.msgs.join(' | '):`Drive em dia — ${r.total} arquivo(s) na pasta, nenhum novo.`);}
  catch(e){if(interactive){toast('Não foi possível sincronizar: '+e.message);set('Erro: '+e.message)}}
  finally{syncing=false}
}
function driveCard(){
  const d=S.drive,cid=gClient();
  return `<section class="card"><div class="ch"><h3>Google Drive</h3><span class="sub">${d.last?'última sincronização: '+new Date(d.last).toLocaleString('pt-BR'):'ainda não sincronizado'}</span></div>
  ${cid?'':`<div class="note">Falta o <b>ID do cliente Google</b> (criado no passo a passo de publicação).<div class="row" style="margin:6px 0 0"><input id="gdCid" style="flex:1;min-width:220px" placeholder="xxxx.apps.googleusercontent.com"><button data-gd="cid">Salvar</button></div></div>`}
  <label class="fld">Pasta das faturas (e extratos, se quiser)<input id="gdFolder" placeholder="Link da pasta do Drive" value="${esc(d.folder||'')}"></label>
  <label class="fld">Pasta só dos extratos da conta (opcional, não compartilhe)<input id="gdExt" placeholder="Link de uma pasta privada" value="${esc(d.folderExt||'')}"></label>
  <label class="fld">Pasta de configuração compartilhada (classificações, fixos e contas)<input id="gdCfg" placeholder="Link de uma pasta compartilhada com permissão de edição" value="${esc(d.folderCfg||'')}"></label>
  <div class="row"><button class="pri" data-gd="sync" ${cid?'':'disabled'}>Conectar e sincronizar faturas</button>${folderId(d.folderCfg)?`<button data-gd="cfgnow" ${cid?'':'disabled'}>${d.cfgOk?'Sincronizar classificações agora':'Autorizar e sincronizar classificações'}</button>`:''}</div>
  <div id="gdMsg" class="muted"></div>
  <div class="muted">Faturas e extratos (.xlsx, .csv, .pdf, .ofx): o app só <b>lê</b> e nunca altera esses arquivos. Faturas novas ou alteradas são importadas; as já lidas são puladas. Os lançamentos ficam apenas neste aparelho.<br>Pasta de configuração: o app grava lá <b>um único arquivo</b> (controle-cartao-config.json) com suas classificações, fixos e contas lançadas à mão, e funde as alterações de todos os aparelhos e usuários que usam a mesma pasta. Como precisa gravar, o Google pede a permissão “ver e editar arquivos do Drive”; o app só mexe nesse arquivo.</div>
  ${folderId(d.folderCfg)?`<div class="muted">${d.cfgErr?`<span class="bad">Configuração: ${esc(d.cfgErr)}</span>`:d.cfgLast?'Configuração sincronizada em '+new Date(d.cfgLast).toLocaleString('pt-BR'):'Configuração ainda não sincronizada'}</div>`:''}
  ${cid&&(folderId(d.folder)||folderId(d.folderCfg))?`<div class="row" style="margin-top:8px"><button class="lnk" data-gd="link">Copiar link de configuração (para outro aparelho ou outra pessoa; não inclui a pasta de extratos)</button></div>`:''}</section>`;
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.nm');if(!t)return;
  if(t.closest('nav')){S.cfg.tab=t.dataset.t;save();render();scrollTo(0,0);return}
  if(t.dataset.go){S.cfg.tab=t.dataset.go;if(t.dataset.pend){S.cfg.flt.pend=true}save();render();scrollTo(0,0);return}
  if(t.classList.contains('nm')){S.cfg.sel=t.dataset.c;render();return}
  if(t.id==='bTheme'){S.cfg.theme=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches)?'light':'dark';save();render();return}
  if(t.dataset.gd){const g=t.dataset.gd;
    if(g==='cid'){const v=($('#gdCid').value||'').trim();if(v){S.drive.clientId=v;save();render()}}
    else if(g==='sync'){S.drive.folder=($('#gdFolder').value||'').trim();S.drive.folderExt=($('#gdExt').value||'').trim();S.drive.folderCfg=($('#gdCfg').value||'').trim();save();runSync(true)}
    else if(g==='cfgnow'){S.drive.folderCfg=($('#gdCfg').value||'').trim();save();cfgSync(true).then(ok=>{if(ok)toast('Classificações sincronizadas.');render()})}
    else if(g==='link'){const u=location.origin+location.pathname+'?cid='+encodeURIComponent(gClient())+(folderId(S.drive.folder)?'&pasta='+encodeURIComponent(folderId(S.drive.folder)):'')+(folderId(S.drive.folderCfg)?'&cfg='+encodeURIComponent(folderId(S.drive.folderCfg)):'');(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copiado. Abra-o no outro aparelho uma única vez.')).catch(()=>prompt('Copie este link:',u))}
    return}
  if(t.id==='bSync'){runSync(true);return}
  if(t.dataset.more){S.cfg.lim=(S.cfg.lim||200)+200;render();return}
  if(t.dataset.fx){const k=t.dataset.k;
    if(t.dataset.fx==='bill'){const nm=($('#bP').value||$('#bN').value).trim(),v=parseFloat($('#bV').value.replace(/\./g,'').replace(',','.'));if(!nm||!(v>=0)){toast('Informe o nome e o valor.');return}S.bills.push({id:Date.now(),name:nm,valor:v,de:$('#bD').value,ate:$('#bA').value,ativo:true});save();render();return}
    if(t.dataset.fx==='add'){const s=suggestions().find(x=>x.key===k);if(s){S.fixed.push({id:Date.now()+Math.random(),key:s.key,name:s.name,cat:s.cat,valor:s.valor,who:s.who,ativo:true,ate:''});save();render()}}
    else if(t.dataset.fx==='no'){S.dismissed.push(k);save();render()}
    else if(t.dataset.fx==='manual'){const nm=$('#mfN').value.trim(),v=parseFloat($('#mfV').value.replace(/\./g,'').replace(',','.'));if(!nm||!(v>0)){toast('Informe nome e valor.');return}
      S.fixed.push({id:Date.now(),key:null,name:nm,cat:$('#mfC').value,valor:v,who:'Todos',ativo:true,ate:$('#mfA').value});save();render()}return}
  if(t.dataset.b==='del'){S.bills.splice(+t.dataset.bi,1);save();render();return}
  if(t.dataset.f==='del'){S.fixed.splice(+t.dataset.fi,1);save();render();return}
  if(t.dataset.rd){delete S.rules[t.dataset.rd];save();render();return}
  if(t.dataset.bk==='exp'){download('controle-cartao-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S),'application/json');return}
  if(t.dataset.bk==='csv'){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';download('lancamentos-classificados.csv','﻿Origem;Fatura/mês;Data;Estabelecimento;Parcela;Valor (gasto positivo);Portador;Categoria\n'+ALL.map(x=>[isConta(x)?'Conta':'Cartão',x.f,x.d,q(x.desc),x.m?x.n+'/'+x.m:'',String(x.v).replace('.',','),x.who,x.cat].join(';')).join('\n'),'text/csv');return}
  if(t.dataset.bk==='reset'){if(confirm('Apagar todos os dados deste navegador (faturas, regras e fixos)?')){localStorage.removeItem(KEY);S={tx:[],meta:{},acc:[],cov:[],_accSeeded:1,bills:[],rules:{},ovr:{},fixed:[],dismissed:[],cfg:{...DEF,flt:{...DEF.flt},tab:'dados'}};save();render()}return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fWho'){S.cfg.who=t.value;save();render();return}
  if(t.id==='fSrc'){S.cfg.src=t.value;save();render();return}
  if(t.id==='fGrp'){S.cfg.group=t.value;save();render();return}
  if(t.id==='file'){importFiles([...t.files]);return}
  if(t.id==='bkf'){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.tx))throw 0;S=o;load();save();render();toast('Backup restaurado.')}catch(x){toast('Arquivo de backup inválido.')}};r.readAsText(t.files[0]);return}
  if(t.dataset.k){const k=t.dataset.k;S.cfg[k]=t.type==='checkbox'?t.checked:t.dataset.num?+t.value:(k==='period'&&t.value!=='all'?+t.value:t.value);save();render();return}
  if(t.dataset.fl==='q')return;
  if(t.dataset.fl){const k=t.dataset.fl;S.cfg.flt[k]=t.type==='checkbox'?t.checked:t.value;S.cfg.lim=200;save();render();return}
  if(t.dataset.bi!==undefined){const f=S.bills[+t.dataset.bi],k=t.dataset.b;if(k==='ativo')f.ativo=t.checked;else if(k==='valor'){const v=parseFloat(t.value.replace(/\./g,'').replace(',','.'));if(v>=0)f.valor=v}else f[k]=t.value;save();render();return}
  if(t.dataset.fi!==undefined){const f=S.fixed[+t.dataset.fi],k=t.dataset.f;if(k==='ativo')f.ativo=t.checked;else if(k==='valor'){const v=parseFloat(t.value.replace(/\./g,'').replace(',','.'));if(v>=0)f.valor=v}else if(k==='ate')f.ate=t.value;save();render();return}
  if(t.dataset.ti!==undefined){const x=ALL[+t.dataset.ti];if(S.cfg.applyAll&&x.key)S.rules[x.key]=t.value;else S.ovr[txh(x)]=t.value;
    // limpa overrides individuais conflitantes quando aplicado ao estabelecimento
    if(S.cfg.applyAll&&x.key)ALL.forEach(y=>{if(y.key===x.key&&isConta(y)===isConta(x))delete S.ovr[txh(y)]});
    save();render();toast('Categoria atualizada'+(S.cfg.applyAll?' para todo o estabelecimento.':'.'));return}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.fl==='q'){S.cfg.flt.q=t.value;S.cfg.lim=200;clearTimeout(window._qh);window._qh=setTimeout(()=>{const r=document.getElementById('lres');if(r)r.innerHTML=lancResults(viewTx(true));save()},200)}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');if(ev==='drop'&&e.dataTransfer.files.length)importFiles([...e.dataTransfer.files])}));
let rz,lastW=innerWidth;addEventListener('resize',()=>{if(innerWidth===lastW)return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;lastW=innerWidth;clearTimeout(rz);rz=setTimeout(render,200)});
load();render();
if(window.GCC_HOSTED){const _r=gHandleReturn();if(_r){setTimeout(()=>{if(_r==='ok'){cfgSync(true).then(ok=>{toast(ok?'Classificações sincronizadas.':'Classificações: '+(S.drive.cfgErr||'falhou'));render()})}else{S.drive.cfgErr=_r;save();toast(_r);render()}},500)}}
if(window.GCC_HOSTED){if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if((S.drive.folder||S.drive.folderExt||S.drive.folderCfg)&&S.drive.connected&&gClient())setTimeout(()=>runSync(false),600);}
</script>
