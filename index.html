<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#85847e;--line:#e3e2dd;--accent:#2a78d6;--warn:#b45309;--ok:#0f7a4f;--bad:#c0392b;

@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#111110;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e86;--line:#2e2e2b;--accent:#3987e5;--warn:#f0a04b;--ok:#3ec28f;--bad:#e66767;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#8a8982;--c9:#46453f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#8f8e86;--line:#2e2e2b;--accent:#3987e5;--warn:#f0a04b;--ok:#3ec28f;--bad:#e66767;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#8a8982;--c9:#46453f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.top h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:140px}
select,input,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.lnk{border:0;background:none;color:var(--accent);padding:2px 6px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}

nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px 0 60px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:650;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ch h3{margin:0;font-size:15px}.ch .sub{color:var(--muted);font-size:12.5px;flex:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.plot svg{display:block;width:100%}
.grid-l{stroke:var(--line);stroke-width:1}.ax{fill:var(--muted);font-size:11px}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:var(--ink);fill-opacity:.05}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13.5px}
.row label{color:var(--ink2);display:flex;align-items:center;gap:6px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.hb .nm{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .nm:hover{color:var(--accent)}
.hb .tr{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.hb .bar{height:100%;background:var(--accent);border-radius:7px}

.hb .vl small{color:var(--muted)}
.hb .on{color:var(--accent);font-weight:600}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink2)}

.note{font-size:13px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink2)}
.drop.over{border-color:var(--accent);background:var(--bg)}
#tip{position:fixed;display:none;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:260px}
#tip b{display:block;margin-bottom:3px}#tip div{display:flex;justify-content:space-between;gap:14px}
#tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13.5px;display:none;z-index:60;max-width:90vw}
.sug{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.sug .t{flex:1;min-width:180px}
.sm{width:110px}.xs{width:80px}
@media (max-width:600px){.hb{grid-template-columns:100px 1fr auto}.kpi .v{font-size:19px}}

<body>
<header><div class="wrap">
 <div class="top"><h1>💳 Controle de Cartão</h1>
  <select id="fWho" aria-label="Portador"></select>
  <select id="fGrp" aria-label="Agrupar por"><option value="fatura">Mês da fatura (vencimento)</option><option value="compra">Mês da compra</option></select>

 <nav id="nav"></nav>

<script>
const SEED={tx:[],meta:{}};
</script>
<script>
"use strict";
/* ============ utilitários ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt0=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const short=v=>{const a=Math.abs(v),s=v<0?'-':'';return s+(a>=1e6?'R$ '+(a/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?'R$ '+(a/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':'R$ '+Math.round(a))};
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const mkey=s=>norm(s).replace(/[^a-z ]+/g,' ').split(/\s+/).filter(Boolean).slice(0,2).join(' ');
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ymLabel=ym=>MES[+ym.slice(5)-1]+'/'+ym.slice(2,4);
const addM=(ym,k)=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const lastDayPrev=ym=>{const p=addM(ym,-1);const d=new Date(Date.UTC(+p.slice(0,4),+p.slice(5),0)).getUTCDate();return p+'-'+String(d).padStart(2,'0')};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const dmy=d=>d.slice(8)+'/'+d.slice(5,7);
const dmyy=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(2,4);
function monday(d){const t=new Date(d+'T12:00:00Z');const k=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-k);return t.toISOString().slice(0,10)}
function addDays(d,n){const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3800)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ============ categorias ============ */
const RULES=[
['Lazer e entretenimento',/kingsh|ingresso|museu|parque da|kartodromo|cinema|teatro|vale da musica|steam|playstation|xbox|nintendo|\bgames?\b|gamelandi|sympla|eventim|bowling/],
['Assinaturas',/google (one|youtube|powerdirector|avg)|youtube|netflix|spotify|linkedin|anthropic|claude|kindle|prime video|disney|hbo|icloud|microsoft|adobe|canva|chatgpt|openai|jusbrasil|dropbox|globoplay|deezer|paramount|duolingo/],
['Taxas e serviços financeiros',/\biof\b|anuidade|tarifa|iptu|ipva|detran|multa|juros|cartorio|serasa/],
['Serviços profissionais',/contabilizei|cpa gestao|company ?hero|facebk|advoca|despachante/],
['Educação',/treinamento|curso|uniso|unid\.? ?de ed|escola|faculdade|udemy|alura|livraria|\blivro/],
['Telefonia e internet',/\bclaro\b|net pgt|\bvivo\b|\btim\b|telefon|starlink/],
['Academia e esporte',/muv fit|totalpass|academia|gympass|smartfit|crossfit|pilates|decathlon/],
['Saúde e farmácia',/farmac|drogar|drogasil|\braia|rdsaude|panvel|nissei|pharmac|unipreco|odonto|clinica|laborat|hospital|\bdent|lentes|otica|optica|fisio|psico|unimed|dermat|exame|saude/],
['Estacionamento e Pedágio',/tagitau|sem parar|conectc|veloe|pedagio|estacion|\bestac\b|parking|\bpark\b|brpark|bcpark|panpark|valet|\bzul \d|zona azul|\bgp6\b|cetro p/],
['Carro e combustível',/posto|combustiv|petropen|petrobras|\bshell\b|ipiranga|autozone|centro automotivo|rodoposto|unidas|localiza|movida|autoposto|minuto pa/],
['Viagens e hospedagem',/\bibis|airbnb|mercure|hotel|pousada|hostel|booking|decolar|iberia|gol lin|latam|azul linhas|smiles|clickbus|rodoviaria|buser|apartments|maisonvilla|resort|airlines|lineas|passagem|seutitoboaviagem|expedia|hurb|123milhas/],
['Transporte',/uber(?!aba)|\b99 ?pop|cabify|indrive|transp colet|\bmetro\b|onibus|\btaxi\b|cptm/],
['Mercado',/festval|festival|condor|assai|atacad|carrefour|minipreco|\bextra\b|\bsams\b|komprao|acougue|mestre da carne|sacolao|hortifruti|supermerc|fresh market|frimais|mercadinho|angeloni|muffato|bistek|comper/],
['Beleza e cuidados',/salao|barbe|depil|esteti|cosmetic|perfum|boticario|natura\b|sephora|manicure|\bspa\b/],
['Restaurantes e cafés',/restaur|lanche|grill|churrasc|burger|burguer|padaria|panificadora|\bpao\b|pizza|cafe|coffee|dripper|sushi|esfiha|sfiha|cantin|bistro|\bbar\b|boteco|gastro|ifd\*|sorvet|gelat|chocolat|bakery|brauerei|biergarten|\bdiner\b|steak|mcdonald|rodosnack|casa china|palacio china|pede thai|buffet|nugali|doceria|empada|salgad|churros|trattoria|osteria|pastel|recanto gaucho|madalosso|grelhad/],
['Casa e construção',/leroy|havan|ferragem|casa legal|camicado|kalunga|embalagens|chaveiro|limpemais|dedetiz|lavand|moldura|multicoisas|ponto das caixas|casa dos fri|flor|jardim/],
['Vestuário e calçados',/renner|riachuelo|calcad|adidas|calvin|outlet|\bmoda\b|loungerie|pijama|shoulder|florence|lumae|playsize|jeans|\bzara\b|boutique|lingerie|kidstok|side walk|city confort|\btng\b/],
['Eletrônicos',/samsung|kabum|apple store|iphone|xiaomi|motorola|lg eletron|philips|jbl|fone de ouvido|notebook|celular|eletronic|fast shop|ponto frio|casas bahia|microsoft\*?store/],
['Acessórios e Jóias',/joia|bijou|semijoia|relogio|vivara|pandora|bering|ourives|prataria/],
['Compras online',/mercadolivre|mercado\*|amazon|shopee|aliexpress|magalu|mag\*|americanas|shein|temu|netshoes|dafiti|miniso/],
['Pets',/\bpet\b|petz|cobasi|veterin|racao|miau/]
];
const SEM='Sem categoria';
const ALLCATS=[...RULES.map(r=>r[0]),SEM].filter((c,i,a)=>a.indexOf(c)===i).sort((a,b)=>a===SEM?1:b===SEM?-1:a.localeCompare(b,'pt'));

/* ============ estado ============ */
const KEY='gcc_v1';
let S;
const DEF={group:'fatura',who:'Todos',period:6,weeks:26,incOld:false,baseN:6,stat:'mean',thr:'',novas:false,tab:'resumo',theme:'auto',sel:null,applyAll:true,flt:{f:'',c:'',q:'',pend:false,parc:false}};
function seedState(){
  return {tx:SEED.tx.map(r=>{const [n,m]=r[3]?r[3].split('/').map(Number):[null,null];return {f:r[0],d:r[1],desc:r[2],n,m,v:r[4],tit:r[5],nome:r[6],tipo:r[7],cart:r[8]}}),
    meta:JSON.parse(JSON.stringify(SEED.meta)),rules:{},ovr:{},fixed:[],dismissed:[],cfg:{...DEF,flt:{...DEF.flt}}};
}
let saveFail=false;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.tx)||!S.tx.length)S=seedState();
  S.cfg={...DEF,...(S.cfg||{}),flt:{...DEF.flt,...((S.cfg||{}).flt||{})}};
  S.drive=S.drive||{};
  try{const u=new URL(location.href),c=u.searchParams.get('cid'),p=u.searchParams.get('pasta');if(c||p){if(c)S.drive.clientId=c;if(p)S.drive.folder=p;history.replaceState(null,'',u.pathname)}}catch(e){}
  ['rules','ovr','meta'].forEach(k=>S[k]=S[k]||{});
  [S.rules,S.ovr].forEach(o=>Object.keys(o).forEach(k=>{if(o[k]==='Assinaturas digitais')o[k]='Assinaturas';if(o[k]==='Estacionamento')o[k]='Estacionamento e Pedágio'}));(S.fixed||[]).forEach(f=>{if(f.cat==='Assinaturas digitais')f.cat='Assinaturas';if(f.cat==='Estacionamento')f.cat='Estacionamento e Pedágio'});['fixed','dismissed'].forEach(k=>S[k]=S[k]||[]);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFail=false}catch(e){if(!saveFail)toast('Não foi possível salvar neste navegador — use Dados › Backup.');saveFail=true}}

/* ============ derivação ============ */
const txh=t=>t.d+'|'+t.desc+'|'+t.v+'|'+(t.m?t.n+'/'+t.m:'');
function catOf(t){const h=txh(t);if(S.ovr[h])return S.ovr[h];const k=mkey(t.desc);if(S.rules[k])return S.rules[k];const n=norm(t.desc);for(const [c,re] of RULES)if(re.test(n))return c;return SEM}
const whoOf=t=>t.tit==='T'||t.tit==='Titular'?'Titular':norm(t.nome).split(' ')[0].replace(/^./,c=>c.toUpperCase())+' (adicional)';
let CAT_SLOT={};
function prep(){
  const tot={};
  S.tx.forEach(t=>{t.cat=catOf(t);t.key=mkey(t.desc);t.who=whoOf(t);t.eff=(t.m&&t.n>=2)?lastDayPrev(t.f):t.d;t.mon=S.cfg.group==='compra'?t.eff.slice(0,7):t.f;
    if(t.cat!==SEM)tot[t.cat]=(tot[t.cat]||0)+Math.max(t.v,0)});
  CAT_SLOT={};Object.entries(tot).sort((a,b)=>b[1]-a[1]).forEach(([c],i)=>CAT_SLOT[c]=Math.min(i,7));
}
const slotOf=c=>CAT_SLOT[c]===undefined?7:CAT_SLOT[c];
const colorOfSlot=i=>`var(--c${i+1})`;
function viewTx(){const w=S.cfg.who;return w==='Todos'?S.tx:S.tx.filter(t=>t.who===w)}
const months=V=>[...new Set(V.map(t=>t.mon))].sort();

/* ============ gráficos ============ */
const tip=$('#tip');
function showTip(html,e){tip.innerHTML=html;tip.style.display='block';const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=innerHeight-r.height-8;tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px'}
const hideTip=()=>tip.style.display='none';
function niceTicks(min,max,cnt){if(max<=min)max=min+1;const raw=(max-min)/cnt,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;const a=Math.floor(min/st)*st,b=Math.ceil(max/st)*st,o=[];for(let v=a;v<=b+st/2;v+=st)o.push(+v.toFixed(6));return o}
/* série por categoria (top 7 por total histórico + Outras) */
function catSeries(V,keys,groupFn){
  const idx={};keys.forEach((k,i)=>idx[k]=i);
  const arr=Array.from({length:9},()=>new Array(keys.length).fill(0));
  V.forEach(t=>{const g=groupFn(t);if(g in idx)arr[t.cat===SEM?8:slotOf(t.cat)][idx[g]]+=t.v});
  const names=Object.keys(CAT_SLOT).filter(c=>CAT_SLOT[c]<7).sort((a,b)=>CAT_SLOT[a]-CAT_SLOT[b]);
  const out=arr.slice(0,7).map((vals,i)=>({name:names[i]||'—',color:colorOfSlot(i),vals})).filter(s=>s.name!=='—');
  out.push({name:'Outras categorias',color:colorOfSlot(7),vals:arr[7]});
  out.push({name:'Sem categoria',color:'var(--c9)',vals:arr[8]});
  return out.filter(s=>s.vals.some(v=>Math.abs(v)>0.004));
}
function drawStacked(el,o){
  const W=Math.max(el.clientWidth,300),H=o.height||290,pl=54,pr=8,pt=10,pb=26,n=o.cols.length;
  let max=0,min=0;const tot=[];
  o.cols.forEach((c,i)=>{let p=0,q=0;o.series.forEach(s=>{const v=s.vals[i]||0;v>=0?p+=v:q+=v});max=Math.max(max,p);min=Math.min(min,q);tot.push(p+q)});
  if(o.avg)max=Math.max(max,o.avg);
  const ticks=niceTicks(min,max,5),y0=ticks[0],y1=ticks[ticks.length-1],iw=W-pl-pr,ih=H-pt-pb,bw=iw/n,bar=Math.min(bw*.74,38);
  const Y=v=>pt+ih*(1-(v-y0)/(y1-y0));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.title)}">`;
  ticks.forEach(t=>s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${short(t)}</text>`);
  const step=Math.max(1,Math.ceil(n*(o.lblw||42)/iw));
  o.cols.forEach((c,i)=>{
    const cx=pl+bw*i+bw/2,x=cx-bar/2;let up=0,dn=0;
    o.series.forEach(se=>{const v=se.vals[i]||0;if(!v)return;let a,b;if(v>=0){a=Y(up+v);b=Y(up);up+=v}else{a=Y(dn);b=Y(dn+v);dn+=v}
      const h=Math.max(b-a-2,1);const st=c.proj?`fill:${se.color};fill-opacity:.5;stroke:${se.color};stroke-dasharray:3 2`:`fill:${se.color}`;
      s+=`<rect x="${x}" y="${a+1}" width="${bar}" height="${h}" rx="2" style="${st}"/>`});

  });

function hbars(items,opt={}){

/* ============ cálculos ============ */
function periodMonths(V){const m=months(V);const p=S.cfg.period;return p==='all'?m:m.slice(-p)}
function catTotals(V,ms){const set=new Set(ms),o={};V.forEach(t=>{if(set.has(t.mon))o[t.cat]=(o[t.cat]||0)+t.v});const T=sum(Object.values(o),x=>Math.max(x,0))||1;
  return Object.entries(o).map(([label,value])=>({label,value,pct:value/T*100})).sort((a,b)=>b.value-a.value)}
function suggestions(){
  const V=S.tx;const ms=[...new Set(V.map(t=>t.f))].sort().slice(-6);const g={};
  V.filter(t=>!t.m&&ms.includes(t.f)&&t.v>0).forEach(t=>{const k=t.key;if(!k)return;const o=g[k]=g[k]||{k,names:{},by:{},cnt:0,virt:0,who:{}};o.names[t.desc]=(o.names[t.desc]||0)+1;o.by[t.f]=(o.by[t.f]||0)+t.v;o.cnt++;o.who[t.who]=(o.who[t.who]||0)+1;if(t.tipo==='Virtual recorrente')o.virt++});
  const out=[];
  for(const o of Object.values(g)){const mm=Object.keys(o.by).sort();if(mm.length<4)continue;const vals=mm.map(m=>o.by[m]),av=mean(vals),cv=Math.sqrt(mean(vals.map(x=>(x-av)**2)))/av,per=o.cnt/mm.length,vr=o.virt/o.cnt;
    if(per>3)continue;if(!((vr>=.5&&cv<=.4)||(per<=1.2&&cv<=.15)))continue;
    if(S.fixed.some(f=>f.key===o.k)||S.dismissed.includes(o.k))continue;
    const nm=Object.entries(o.names).sort((a,b)=>b[1]-a[1])[0][0],who=Object.entries(o.who).sort((a,b)=>b[1]-a[1])[0][0];
    out.push({key:o.k,name:nm,meses:mm.length,valor:Math.round(mean(vals.slice(-3))*100)/100,cv,who,cat:catOf({desc:nm,d:'',v:0,m:null})});}
  return out.sort((a,b)=>b.valor-a.valor);
}
const fixedOk=f=>f.ativo&&(S.cfg.who==='Todos'||f.who==='Todos'||f.who===S.cfg.who);
function project(V){
  const fats=[...new Set(S.tx.map(t=>t.f))].sort(),last=fats[fats.length-1],c=S.cfg;
  const act=S.fixed.filter(f=>f.ativo&&f.key),fk=new Set(act.filter(fixedOk).map(f=>f.key)),allfk=new Set(act.map(f=>f.key));
  const base=fats.slice(-c.baseN),thr=parseFloat(String(c.thr).replace(',','.'));
  const H={},vb={},np={};fats.forEach(f=>{H[f]={parc:0,fixo:0,vari:0};vb[f]=0;np[f]=0});
  V.forEach(t=>{const L=H[t.f];if(!L)return;if(t.m){L.parc+=t.v;if(t.n===1)np[t.f]+=t.v}else if(fk.has(t.key))L.fixo+=t.v;else{L.vari+=t.v;if(!(thr>0&&t.v>thr)&&!allfk.has(t.key))vb[t.f]+=t.v}});
  const agg=a=>c.stat==='median'?median(a):mean(a);
  const vari=agg(base.map(f=>vb[f])),novas=c.novas?agg(base.map(f=>np[f])):0;
  const ms=Array.from({length:12},(_,i)=>addM(last,i+1)),parc=ms.map(()=>0),list={};
  V.forEach(t=>{if(!t.m)return;const k=t.desc+'|'+t.d+'|'+t.m;const o=list[k]=list[k]||{desc:t.desc,d:t.d,m:t.m,n:0,f:'',v:0,who:t.who};if(t.f>=o.f){o.f=t.f;o.n=t.n;o.v=t.v}});
  const open=Object.values(list).filter(o=>o.f===last&&o.n<o.m);
  open.forEach(o=>{for(let k=1;k<=o.m-o.n&&k<=12;k++)parc[k-1]+=o.v;o.rest=(o.m-o.n)*o.v;o.fim=addM(last,o.m-o.n)});
  const fixo=ms.map(ym=>sum(S.fixed.filter(f=>fixedOk(f)&&(!f.ate||ym<=f.ate)),f=>f.valor));
  return {fats,last,ms,parc,fixo,vari,novas,H,open:open.sort((a,b)=>b.rest-a.rest),thr};
}

/* ============ importação ============ */
const MESN={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function toISO(v){
  if(v instanceof Date)return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  if(typeof v==='string'){const m=v.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;const n=v.trim().match(/^(\d{4})-(\d{2})-(\d{2})/);if(n)return n[0]}
  return null}
function toNum(v){if(typeof v==='number')return v;if(typeof v!=='string')return NaN;let s=v.replace(/[R$\s]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}
function parseSheet(rows,fname){
  const cell=(r,i)=>r[i];let title=null,card=null,hdr=-1;
  rows.forEach((r,i)=>{r.forEach((c,j)=>{if(typeof c==='string'){const m=norm(c).match(/^fatura\s+(\w+)\s*-\s*(\w+)\/(\d{4})/);if(m&&!title)title={st:c.split('-')[0].replace(/^Fatura\s+/i,'').trim(),mes:MESN[m[2]],ano:+m[3]};
      if(/final \d{4}/i.test(c)&&!card){card={valor:toNum(r.find((x,k)=>k>j&&typeof x==='number')),fv:toISO(r.find((x,k)=>k>j&&(x instanceof Date||(typeof x==='number'&&x>20000&&x<80000)||(typeof x==='string'&&toISO(x)))))}}}});
    if(hdr<0&&r.some(c=>typeof c==='string'&&norm(c)==='data')&&r.some(c=>typeof c==='string'&&/^lancamento/.test(norm(c))))hdr=i});
  if(hdr<0)throw new Error('cabeçalho "Data / Lançamento" não encontrado');
  const H={};rows[hdr].forEach((c,j)=>{if(typeof c==='string')H[norm(c)]=j});
  const col=(...ns)=>{for(const n of ns)for(const k in H)if(k.startsWith(n))return H[k];return -1};
  const cD=col('data'),cL=col('lancamento'),cP=col('parcel'),cV=col('valor'),cT=col('titular'),cN=col('nome'),cK=col('tipo do'),cC=col('numero');
  let f=title?`${title.ano}-${String(title.mes).padStart(2,'0')}`:null;
  const fv=card&&card.fv;if(!f&&fv)f=fv.slice(0,7);
  if(!f)throw new Error('não consegui identificar o mês da fatura');
  const out=[];
  for(let i=hdr+1;i<rows.length;i++){const r=rows[i],d=toISO(r[cD]);if(!d)continue;const desc=String(r[cL]||'').trim();if(!desc||/^pagamento/i.test(norm(desc)))continue;
    const v=toNum(r[cV]);if(isNaN(v))continue;const pm=String(r[cP]||'').match(/(\d+)\s*de\s*(\d+)/i);
    out.push({f,d,desc,n:pm?+pm[1]:null,m:pm?+pm[2]:null,v:Math.round(v*100)/100,tit:/adic/i.test(String(r[cT]||''))?'A':'T',nome:String(r[cN]||''),tipo:String(r[cK]||''),cart:String(r[cC]||'')})}
  if(!out.length)throw new Error('nenhum lançamento encontrado');
  return {f,tx:out,meta:{fv:fv||null,st:title?title.st:'',valor:card&&!isNaN(card.valor)?card.valor:null}};
}
function ingest(name,input,isCsv){
  const wb=isCsv?XLSX.read(input,{type:'string',raw:true}):XLSX.read(input,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const r=parseSheet(rows,name);
  const had=S.tx.some(t=>t.f===r.f);S.tx=S.tx.filter(t=>t.f!==r.f).concat(r.tx);S.meta[r.f]=r.meta;
  const s=sum(r.tx,t=>t.v),ok=r.meta.valor==null||Math.abs(s-r.meta.valor)<0.01;
  return `${ymLabel(r.f)}: ${r.tx.length} lançamentos${had?' (substituída)':''}${ok?' ✓':' ⚠ não confere com o valor oficial'}`;
}
function finishImport(msgs){S.tx.sort((a,b)=>a.f.localeCompare(b.f)||b.d.localeCompare(a.d));save();render();if(msgs&&msgs.length)toast(msgs.join(' | '))}
async function importFiles(files){
  const msgs=[];
  for(const file of files){try{const isCsv=/\.csv$/i.test(file.name);msgs.push(ingest(file.name,isCsv?await file.text():await file.arrayBuffer(),isCsv))}catch(e){msgs.push(`${file.name}: erro — ${e.message}`)}}
  finishImport(msgs);
}

/* ============ Google Drive (somente leitura) ============ */
const GCFG=()=>window.GCC_CONFIG||{};
const gClient=()=>(S.drive&&S.drive.clientId)||GCFG().clientId||'';
let gTok=null,gExp=0;
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('sem conexão com o Google'));document.head.appendChild(s)})}
async function gToken(interactive){
  if(gTok&&Date.now()<gExp-60000)return gTok;
  await loadGIS();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:gClient(),scope:'https://www.googleapis.com/auth/drive.readonly',
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));gTok=r.access_token;gExp=Date.now()+(+r.expires_in||3600)*1000;res(gTok)},
      error_callback:e=>rej(new Error((e&&(e.message||e.type))||'login cancelado'))});
    tc.requestAccessToken({prompt:interactive?'':'none'});
  });
}
async function gGet(url,tok){const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});if(!r.ok){let m='';try{m=(await r.text()).slice(0,200)}catch(e){}throw new Error('Drive '+r.status+(r.status===404?' — pasta não encontrada ou sem acesso':'')+(m&&r.status!==404?' '+m:''))}return r}
const folderId=s=>{s=String(s||'').trim();const m=s.match(/folders\/([-\w]{10,})/)||s.match(/[?&]id=([-\w]{10,})/);return m?m[1]:(/^[-\w]{10,}$/.test(s)?s:'')};
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
async function driveSync(interactive){
  const id=folderId(S.drive.folder);if(!id)throw new Error('informe o link da pasta do Drive');
  if(!gClient())throw new Error('falta o ID do cliente Google');
  const tok=await gToken(interactive);
  let files=[],pt='';
  do{const q=encodeURIComponent(`'${id}' in parents and trashed=false`);
    const r=await(await gGet(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType,modifiedTime)&pageSize=200&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+encodeURIComponent(pt):''}`,tok)).json();
    files=files.concat(r.files||[]);pt=r.nextPageToken}while(pt);
  const cand=files.filter(f=>/\.(xlsx|xls|csv)$/i.test(f.name)||f.mimeType===XLSX_MIME||f.mimeType==='application/vnd.google-apps.spreadsheet');
  S.drive.seen=S.drive.seen||{};
  const msgs=[];let novos=0;
  for(const f of cand){
    if(S.drive.seen[f.id]===f.modifiedTime)continue;
    try{
      const gs=f.mimeType==='application/vnd.google-apps.spreadsheet';
      const url=gs?`https://www.googleapis.com/drive/v3/files/${f.id}/export?mimeType=${encodeURIComponent(XLSX_MIME)}`:`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&supportsAllDrives=true`;
      const buf=await(await gGet(url,tok)).arrayBuffer();const isCsv=/\.csv$/i.test(f.name)&&!gs;
      msgs.push(ingest(f.name,isCsv?new TextDecoder().decode(buf):buf,isCsv));S.drive.seen[f.id]=f.modifiedTime;novos++;
    }catch(e){msgs.push(`${f.name}: erro — ${e.message}`)}
  }
  S.drive.last=new Date().toISOString();S.drive.connected=true;
  return {total:cand.length,novos,msgs};
}
let syncing=false;
async function runSync(interactive){
  if(syncing)return;syncing=true;const set=m=>{const e=document.getElementById('gdMsg');if(e)e.textContent=m};
  set('Sincronizando…');
  try{const r=await driveSync(interactive);finishImport(r.novos?r.msgs:[]);
    toast(r.novos?r.msgs.join(' | '):`Drive em dia — ${r.total} arquivo(s) na pasta, nenhum novo.`);}
  catch(e){if(interactive){toast('Não foi possível sincronizar: '+e.message);set('Erro: '+e.message)}}
  finally{syncing=false}
}
function driveCard(){
  const d=S.drive,cid=gClient();
  return `<section class="card"><div class="ch"><h3>Google Drive</h3><span class="sub">${d.last?'última sincronização: '+new Date(d.last).toLocaleString('pt-BR'):'ainda não sincronizado'}</span></div>
  ${cid?'':`<div class="note">Falta o <b>ID do cliente Google</b> (criado no passo a passo de publicação).<div class="row" style="margin:6px 0 0"><input id="gdCid" style="flex:1;min-width:220px" placeholder="xxxx.apps.googleusercontent.com"><button data-gd="cid">Salvar</button></div></div>`}
  <div class="row"><input id="gdFolder" style="flex:1;min-width:240px" placeholder="Link da pasta do Drive com as faturas" value="${esc(d.folder||'')}"><button class="pri" data-gd="sync" ${cid?'':'disabled'}>Conectar e sincronizar</button></div>

}

  if(t.dataset.fl==='q')return;
  if(t.dataset.fl){const k=t.dataset.fl;S.cfg.flt[k]=t.type==='checkbox'?t.checked:t.value;S.cfg.lim=200;save();render();return}
  if(t.dataset.fi!==undefined){const f=S.fixed[+t.dataset.fi],k=t.dataset.f;if(k==='ativo')f.ativo=t.checked;else if(k==='valor'){const v=parseFloat(t.value.replace(/\./g,'').replace(',','.'));if(v>=0)f.valor=v}else if(k==='ate')f.ate=t.value;save();render();return}
  if(t.dataset.ti!==undefined){const x=S.tx[+t.dataset.ti];if(S.cfg.applyAll&&x.key)S.rules[x.key]=t.value;else S.ovr[txh(x)]=t.value;
    // limpa overrides individuais conflitantes quando aplicado ao estabelecimento
    if(S.cfg.applyAll&&x.key)S.tx.forEach(y=>{if(y.key===x.key)delete S.ovr[txh(y)]});
    save();render();toast('Categoria atualizada'+(S.cfg.applyAll?' para todo o estabelecimento.':'.'));return}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.fl==='q'){S.cfg.flt.q=t.value;S.cfg.lim=200;clearTimeout(window._qh);window._qh=setTimeout(()=>{const r=document.getElementById('lres');if(r)r.innerHTML=lancResults(viewTx());save()},200)}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');if(ev==='drop'&&e.dataTransfer.files.length)importFiles([...e.dataTransfer.files])}));
let rz,lastW=innerWidth;addEventListener('resize',()=>{if(innerWidth===lastW)return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;lastW=innerWidth;clearTimeout(rz);rz=setTimeout(render,200)});
load();render();
if(window.GCC_HOSTED){if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(S.drive.folder&&S.drive.connected&&gClient())setTimeout(()=>runSync(false),600);}
</script>
